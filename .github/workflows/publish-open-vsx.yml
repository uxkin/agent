# Publishes the UXKIN VS Code extensions to Open VSX (the extension
# store used by Cursor, Windsurf, VSCodium and other VS Code-based
# editors). Run by hand only (Actions → Publish to Open VSX → Run
# workflow). Builds the 7 extensions from the vscode-extensions branch
# with vscode/build.mjs. The Open VSX access token lives only in the
# repository secret OVSX_PAT; it is never printed or stored anywhere else.
name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit with the extensions
        default: vscode-extensions
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The builder reads each design plugin's skills from its own branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build and package
        run: node vscode/build.mjs --package
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::error::Add the OVSX_PAT repository secret first."; exit 1; fi
          # The namespace (publisher) is made once; afterwards this says it exists.
          npx --yes ovsx@1.3.0 create-namespace uxkin -p "$OVSX_PAT" || true
          for f in vscode/dist/*.vsix; do
            echo "Publishing $f"
            npx --yes ovsx@1.3.0 publish "$f" -p "$OVSX_PAT"
          done
