# Security and quality scan of the plugin packaging (Claude, Codex,
# Cursor, Gemini): risky skill instructions, hard-coded secrets, unsafe
# MCP settings, unpinned actions. Results appear under Security → Code
# scanning; the build fails on a high-severity finding or a score
# below 85.
name: Plugin scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the plugin
        uses: hashgraph-online/ai-plugin-scanner-action@9a85f17293940b730c459e0702d42af9e6e049e1 # v1.2.763
        with:
          plugin_dir: "."
          mode: scan
          min_score: 85
          fail_on_severity: high
          format: sarif
          upload_sarif: true
